name: build-panel

# 面板（panel/）的构建全部在 GitHub 上跑：本地只提交源码，产物从 Actions 下载。
on:
  push:
    branches: [master]
    paths:
      - 'panel/**'
      - '.github/workflows/build-panel.yml'
  pull_request:
    paths:
      - 'panel/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          Write-Host "csc:  $csc"
          & $csc -version
          Write-Host "node: $(node --version)"
          Write-Host "runner: $env:RUNNER_OS"

      - name: Build app and installer
        run: |
          # -BundleNode: the artifact carries node.exe, so the target machine needs no Node.js
          ./panel/build.ps1 -BundleNode

      - name: Verify artifacts
        run: |
          $exe   = 'panel/dist/Craftmind.exe'
          $setup = 'panel/dist/Craftmind-Setup.exe'
          foreach ($f in @($exe, $setup)) {
            if (-not (Test-Path $f)) { throw "missing $f" }
            $i = Get-Item $f
            if ($i.Length -lt 200KB) { throw "$f is suspiciously small: $($i.Length) bytes" }
            Write-Host ("{0,-30} {1,10:N0} bytes" -f $i.Name, $i.Length)
          }
          # The exe must really carry its embedded resources, otherwise it only fails at runtime.
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($needle in @('wv2.core', 'wv2.winforms', 'wv2.loader', 'server.js', 'index.html')) {
            if ($text -notmatch [regex]::Escape($needle)) { throw "resource '$needle' is not embedded in the exe" }
          }
          Write-Host 'embedded resources OK'
          if (Test-Path 'panel/dist/node.exe') { Write-Host 'node.exe bundled (portable build)' }

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item 'panel/dist/Craftmind-Setup.exe' out/

          $portable = 'out/portable'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item 'panel/dist/Craftmind.exe' $portable/
          if (Test-Path 'panel/dist/node.exe') { Copy-Item 'panel/dist/node.exe' $portable/ }
          Copy-Item 'panel/README.txt' (Join-Path $portable '使用说明.txt')

          $readme = @(
            'Craftmind 便携版',
            '====================',
            '',
            '双击 Craftmind.exe 即可运行，不需要安装。',
            '',
            '- 本目录自带的 node.exe 会被优先使用；删掉它则回退到系统 PATH 里的 Node.js',
            '- 配置/日志在：本目录\Craftmind-data（便携模式，跟着目录走）',
            '- 想装进系统（开始菜单 + 卸载项）：运行 Craftmind-Setup.exe'
          )
          $readme -join "`r`n" | Out-File -FilePath (Join-Path $portable '便携版说明.txt') -Encoding utf8

          Compress-Archive -Path "$portable/*" -DestinationPath 'out/Craftmind-portable.zip' -Force
          Get-ChildItem out -Recurse -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Craftmind-Setup
          path: out/Craftmind-Setup.exe
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Craftmind-portable
          path: out/Craftmind-portable.zip
          if-no-files-found: error
